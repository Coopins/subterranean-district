<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f10" />

    <title>
      {% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}
    </title>

    {% if page.description %}
      <meta name="description" content="{{ page.description }}" />
    {% else %}
      <meta name="description" content="{{ site.description }}" />
    {% endif %}

    <!-- Cache-busted stylesheet -->
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  </head>

  <body>
    <header class="sd-shell sd-header">
      <div class="sd-inner">
        <a class="sd-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

        <nav class="sd-nav" aria-label="Primary">
          {% for path in site.header_pages %}
            {% assign p = site.pages | where: "path", path | first %}
            {% if p %}
              <a class="sd-navlink" href="{{ p.url | relative_url }}">{{ p.title }}</a>
            {% endif %}
          {% endfor %}
        </nav>
      </div>
      <div class="sd-rule" aria-hidden="true"></div>
    </header>

    <main class="sd-shell sd-main" id="content">
      <section class="sd-section sd-page">
        <div class="sd-inner">
          {{ content }}
        </div>
      </section>
    </main>

    <footer class="sd-shell sd-footer">
      <div class="sd-inner">
        <div class="sd-footmeta">
          © <span id="y"></span> {{ site.title }} · {{ site.description }}
        </div>
      </div>
    </footer>

    <script>
      document.getElementById("y").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
