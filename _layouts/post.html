---
layout: default
---

<main class="page-main">
  <div class="page-inner">
    <article>
      <header class="post-header">
        <div class="card-tag">
          {{ page.date | date: "%B %-d, %Y" }}{% if page.categories %} &middot; {{ page.categories | join: ", " }}{% endif %}
        </div>
        <h1 class="post-title">{{ page.title }}</h1>
      </header>

      <div class="post-content">
        {{ content }}
      </div>

      <div class="post-footer">
        <a href="{{ '/archive/' | relative_url }}" class="manifesto-link" style="margin-top:0;">Back to archive</a>
      </div>
    </article>
  </div>
</main>
